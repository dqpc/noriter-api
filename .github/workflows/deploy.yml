name: deploy

on:
  push:
    branches: [main, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, home]
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      PORT: ${{ github.ref_name == 'main' && '8080' || '8081' }}
    steps:
      - uses: actions/checkout@v4
      - name: java
        run: |
          export JAVA_HOME=$HOME/opt/jdk-25/Contents/Home
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version
      - name: test + bootJar
        run: ./gradlew test bootJar --no-daemon -q
      - name: deploy ($TARGET)
        run: |
          set -e
          cp build/libs/noriter-api-*.jar "$HOME/opt/noriter-api-$TARGET/app.jar.new"
          mv "$HOME/opt/noriter-api-$TARGET/app.jar.new" "$HOME/opt/noriter-api-$TARGET/app.jar"
          launchctl unload "$HOME/Library/LaunchAgents/games.noriter.api-$TARGET.plist"
          launchctl load -w "$HOME/Library/LaunchAgents/games.noriter.api-$TARGET.plist"
          for i in $(seq 1 90); do curl -sf "http://127.0.0.1:$PORT/actuator/health" >/dev/null && break; sleep 2; done
          curl -sf "http://127.0.0.1:$PORT/actuator/health"
